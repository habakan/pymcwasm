[project]
name = "pymcwasm"
version = "0.1.0"
description = "Sample a PyMC model in a browser: its log density compiled to WebAssembly, drawn by nuts-rs, with no Python sampler."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/habakan/pymcwasm"
stanwasm = "https://github.com/habakan/stanwasm"

[project.optional-dependencies]
# Only the offline artifact builder and the checks need these; the package
# itself runs inside Pyodide, where PyMC is installed by the page.
build = ["pymc", "scipy", "nutpie", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pymcwasm"]
