name: pages

# Both examples are static, so this assembles a directory rather than building
# anything: the repository as it stands, plus the published `tapewasm` package
# copied to the path the pages fetch it from.
#
# Needs the repository to be public, or a plan that allows Pages on a private
# one. Until then this only runs when asked.
on:
  push:
    branches: [main]
    paths:
      - "examples/**"
      - "index.html"
      - "src/**"
      - "artifacts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: assemble the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - run: npm ci

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: build the JupyterLite notebook
        run: bash examples/jupyterlite/build.sh

      # `serve.mjs` maps two paths that do not exist on disk. A static host has
      # no such mapping, so they become real directories here.
      - name: lay the site out the way serve.mjs serves it
        run: |
          mkdir -p site
          cp -r examples artifacts site/
          mkdir -p site/pkg && cp -r src/pymcwasm site/pkg/
          mkdir -p site/vendor && cp -r node_modules/tapewasm/* site/vendor/
          mkdir -p site/posteriorwasm && cp -r node_modules/posteriorwasm/* site/posteriorwasm/
          cp index.html site/
          rm -rf site/examples/jupyterlite && cp -r examples/jupyterlite/_output site/lite

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: deploy to github-pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
